<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">
    <title>Habits</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        h1 { color: #fff; font-size: 1.1rem; font-weight: 600; }
        .settings-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 8px; min-width: 44px; min-height: 44px; }
        .date-header { color: #666; font-size: 0.75rem; margin-bottom: 6px; }
        .time-note { color: #f59e0b; font-size: 0.65rem; margin-bottom: 6px; }

        /* Icon Grid Layout */
        .habits-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; }
        .habit-icon-wrapper { display: flex; flex-direction: column; align-items: center; }
        .habit-icon {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            cursor: pointer; padding: 2px; border-radius: 12px; transition: background 0.15s;
        }
        .habit-icon:active { background: rgba(255,255,255,0.05); }

        .habit-ring {
            width: 64px; height: 64px; border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: conic-gradient(#667eea var(--progress), #2a2a3e var(--progress));
            transition: all 0.2s;
        }
        .habit-ring::before {
            content: ''; position: absolute; width: 54px; height: 54px;
            background: #1a1a2e; border-radius: 50%;
        }
        .habit-ring.completed { background: #4ade80; }
        .habit-ring.completed::before { background: #4ade80; }
        .habit-ring.overdue { background: conic-gradient(#dc2626 var(--progress), #2a2a3e var(--progress)); }

        /* Neglect indicators - 1 to 3 red dots along the circle arc */
        .neglect-dots { position: absolute; inset: 0; pointer-events: none; }
        .neglect-dot {
            position: absolute; width: 8px; height: 8px;
            background: #dc2626; border-radius: 50%; border: 1.5px solid #1a1a2e;
        }
        /* Position dots along the top-right arc of the 52px circle */
        .neglect-dot:nth-child(1) { top: 1px; right: 10px; }
        .neglect-dot:nth-child(2) { top: 6px; right: 2px; }
        .neglect-dot:nth-child(3) { top: 16px; right: -2px; }

        .habit-emoji {
            position: relative; z-index: 1; font-size: 1.3rem; line-height: 1;
        }
        .habit-ring.completed .habit-emoji { filter: brightness(1.2); }

        /* Twice daily split ring with divider */
        .habit-ring.split { background: #2a2a3e; }
        .habit-ring.split .half-fill {
            position: absolute; width: calc(50% - 1px); height: 100%; top: 0;
        }
        .habit-ring.split .half-fill.left { left: 0; border-radius: 32px 0 0 32px; }
        .habit-ring.split .half-fill.right { right: 0; border-radius: 0 32px 32px 0; }
        .habit-ring.split .half-fill.filled { background: #4ade80; }
        .habit-ring.split .half-fill.missed { background: #dc262666; }
        .habit-ring.split .divider {
            position: absolute; width: 2px; height: 100%; left: 50%; transform: translateX(-50%);
            background: linear-gradient(to bottom, transparent 4px, #555 4px, #555 calc(100% - 4px), transparent calc(100% - 4px));
            z-index: 0;
        }

        /* Prominent section containers */
        .habits-section { background: #1a1a2e; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
        .section-header {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            background: linear-gradient(135deg, #1f1f35 0%, #1a1a2e 100%);
            border-bottom: 1px solid #2a2a3e;
        }
        .section-header.collapsible { cursor: pointer; }
        .section-icon { font-size: 0.9rem; }
        .section-title { font-size: 0.8rem; font-weight: 600; color: #fff; flex: 1; }
        .section-count { color: #666; font-size: 0.7rem; background: #0f0f1a; padding: 2px 8px; border-radius: 10px; }
        .section-header .collapse-icon { color: #555; font-size: 0.6rem; transition: transform 0.2s; }
        .section-header.collapsed .collapse-icon { transform: rotate(-90deg); }

        .inactive-section { opacity: 0.7; }
        .inactive-section .section-header { background: #151525; }
        .section-content { transition: max-height 0.2s ease-out; overflow: hidden; }
        .section-content.collapsed { max-height: 0 !important; }

        .habit-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a2a3e; gap: 8px; min-height: 44px; }
        .habit-item:last-child { border-bottom: none; padding-bottom: 0; }
        .habit-item:first-of-type { padding-top: 0; }
        .habit-item.completed .habit-name { color: #555; text-decoration: line-through; }
        .habit-edit-btn { background: none; border: none; color: #555; font-size: 0.85rem; padding: 8px; cursor: pointer; flex-shrink: 0; min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
        .habit-edit-btn:active { color: #667eea; }

        .habit-checkbox {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #444;
            background: transparent; cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; transition: all 0.15s;
        }
        .habit-checkbox.checked { background: #667eea; border-color: #667eea; }
        .habit-checkbox.checked::after { content: '✓'; color: white; font-size: 12px; }

        .habit-info { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .habit-name { font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .habit-meta { font-size: 0.7rem; color: #666; flex-shrink: 0; }
        .overdue-badge { background: #dc2626; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 0.65rem; font-weight: 600; }
        .score-badge { padding: 2px 6px; border-radius: 8px; font-size: 0.65rem; font-weight: 600; }
        .score-badge.amber { background: #f59e0b; color: #000; }
        .score-badge.red { background: #dc2626; color: #fff; }

        .empty-state { text-align: center; padding: 40px 16px; color: #555; }
        .empty-state-icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.5; }

        .fab {
            position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px;
            border-radius: 50%; background: #667eea; color: white; border: none;
            font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .fab:active { transform: scale(0.95); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-end;
            justify-content: center; z-index: 200; opacity: 0; visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background: #1a1a2e; border-radius: 16px 16px 0 0; padding: 18px;
            width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.25s ease-out;
        }
        .modal-overlay.active .modal { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .modal-close { background: none; border: none; font-size: 1.4rem; color: #666; cursor: pointer; padding: 8px; min-width: 44px; min-height: 44px; }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input {
            width: 100%; padding: 12px; border: 1px solid #2a2a3e; border-radius: 8px;
            font-size: 1rem; background: #0f0f1a; color: #fff; outline: none;
        }
        .form-input:focus { border-color: #667eea; }
        .form-input::placeholder { color: #444; }

        .time-toggle { display: inline-flex; background: #0a0a14; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
        .time-toggle-btn { padding: 8px 10px; font-size: 0.95rem; color: #666; cursor: pointer; border: none; background: transparent; min-width: 42px; }
        .time-toggle-btn.active { background: #667eea; color: white; }
        .time-toggle-btn.disabled { opacity: 0.4; pointer-events: none; }

        .frequency-options { display: flex; flex-direction: column; gap: 6px; }
        .frequency-option {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #2a2a3e;
            border-radius: 8px; background: #0f0f1a; cursor: pointer; transition: all 0.15s;
        }
        .frequency-option.selected { border-color: #667eea; background: rgba(102, 126, 234, 0.1); }
        .frequency-radio { display: none; }
        .frequency-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #444; flex-shrink: 0; }
        .frequency-option.selected .frequency-dot { border-color: #667eea; background: #667eea; }
        .frequency-label { color: #ccc; font-size: 0.85rem; }
        .frequency-input { width: 54px; padding: 8px; border: 1px solid #2a2a3e; border-radius: 8px; text-align: center; font-size: 0.95rem; background: #1a1a2e; color: #fff; }
        .period-toggle { display: inline-flex; border: 1px solid #2a2a3e; border-radius: 8px; overflow: hidden; margin-left: auto; }
        .period-toggle-btn { padding: 8px 12px; font-size: 0.85rem; color: #666; cursor: pointer; border: none; background: #0a0a14; }
        .period-toggle-btn.active { background: #667eea; color: white; }
        .frequency-row { display: flex; align-items: center; gap: 10px; }
        .frequency-row #frequencyInputs { display: flex; align-items: center; gap: 8px; }
        .task-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .option-pill { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; background: #0f0f1a; border: 1px solid #2a2a3e; border-radius: 18px; cursor: pointer; font-size: 0.9rem; color: #888; transition: all 0.15s; }
        .option-pill:hover:not(.disabled) { border-color: #444; }
        .option-pill.active { background: rgba(102, 126, 234, 0.15); border-color: #667eea; color: #667eea; }
        .option-pill.disabled { opacity: 0.35; cursor: not-allowed; }
        .option-pill-check { display: none; font-size: 0.75rem; }
        .option-pill.active .option-pill-check { display: inline; }

        .submit-btn {
            width: 100%; padding: 14px; background: #667eea; color: white; border: none;
            border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 6px;
            min-height: 48px;
        }
        .submit-btn:active { opacity: 0.9; }
        .submit-btn.danger { background: #dc2626; }
        .submit-btn.secondary { background: #2a2a3e; }

        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a3e; }
        .detail-label { color: #888; font-size: 0.75rem; }
        .detail-value { color: #fff; font-size: 0.75rem; }

        .momentum-display { background: #0f0f1a; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 10px; }
        .momentum-score { font-size: 1.8rem; font-weight: 700; }
        .momentum-score.positive { color: #4ade80; }
        .momentum-score.negative { color: #dc2626; }
        .momentum-score.neutral { color: #888; }
        .momentum-max { color: #555; font-size: 1rem; font-weight: 400; }
        .momentum-label { font-size: 0.65rem; color: #666; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; }
        .stat-box { background: #0f0f1a; border-radius: 8px; padding: 8px 4px; text-align: center; }
        .stat-number { font-size: 1rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.55rem; color: #666; margin-top: 1px; }

        .action-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .action-buttons .submit-btn { padding: 10px; font-size: 0.85rem; }
        .action-row { display: flex; gap: 6px; }
        .action-row .submit-btn { flex: 1; }

        .dual-checkbox { display: flex; gap: 4px; }
        .dual-checkbox .habit-checkbox { width: 20px; height: 20px; }
        .dual-checkbox .habit-checkbox::after { font-size: 10px; }

        /* Half-circle checkbox for twice daily */
        .half-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #444;
            background: transparent; cursor: pointer; position: relative; flex-shrink: 0;
            overflow: hidden;
        }
        .half-circle .half {
            position: absolute; width: 50%; height: 100%; top: 0; transition: background 0.15s;
        }
        .half-circle .half.left { left: 0; border-right: 1px solid #333; }
        .half-circle .half.right { right: 0; }
        .half-circle .half.filled { background: #667eea; }
        .half-circle.both-filled { border-color: #667eea; }
        .half-circle .half.missed { background: #dc262633; }

        .inactive-section { opacity: 0.6; }
        .inactive-section .section-header { border-bottom-color: #222; }
        .inactive-section .habit-item { border-bottom-color: #222; }

        .sub-header { font-size: 0.7rem; color: #888; padding: 10px 8px 4px 8px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .sub-header-icon { font-size: 0.8rem; }
        .sub-header:first-child { padding-top: 4px; }

        .subtask-indicator { font-size: 0.6rem; color: #888; background: #2a2a3e; padding: 2px 5px; border-radius: 6px; }
        .subtask-indicator.partial { color: #f59e0b; }
        .subtask-indicator.complete { color: #4ade80; }
        .subtask-list { margin-top: 10px; }
        .subtask-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2a3e; min-height: 36px; }
        .subtask-item:last-child { border-bottom: none; }
        .subtask-checkbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #444; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .subtask-checkbox.checked { background: #667eea; border-color: #667eea; }
        .subtask-checkbox.checked::after { content: '✓'; color: white; font-size: 10px; }
        .subtask-name { flex: 1; color: #ccc; font-size: 0.8rem; }
        .subtask-name.completed { color: #555; text-decoration: line-through; }
        .subtask-name-input { flex: 1; color: #ccc; font-size: 0.8rem; background: transparent; border: none; border-bottom: 1px solid transparent; outline: none; padding: 2px 0; }
        .subtask-name-input:focus { border-bottom-color: #667eea; }
        .subtask-delete { color: #666; font-size: 0.7rem; cursor: pointer; padding: 4px 8px; min-width: 32px; min-height: 32px; display: flex; align-items: center; justify-content: center; }
        .add-subtask { display: flex; gap: 6px; margin-top: 6px; }
        .add-subtask input { flex: 1; padding: 8px; border: 1px solid #2a2a3e; border-radius: 6px; background: #0f0f1a; color: #fff; font-size: 0.8rem; }
        .add-subtask button { padding: 8px 14px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; min-width: 44px; }

        /* Inline subtasks on main screen */
        .inline-subtasks-container { margin-left: 32px; padding-left: 10px; border-left: 2px solid #2a2a3e; }
        .inline-subtask { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-height: 28px; }
        .inline-subtask .subtask-checkbox { width: 14px; height: 14px; border-radius: 3px; }
        .inline-subtask .subtask-name { font-size: 0.75rem; color: #777; }
        .inline-subtask .subtask-name.completed { color: #555; text-decoration: line-through; }

        /* Sort select */
        .settings-select { padding: 8px 12px; border: 1px solid #2a2a3e; border-radius: 8px; background: #0f0f1a; color: #fff; font-size: 0.9rem; min-width: 140px; }

        /* Compact toggle */
        .toggle-row { display: flex; align-items: center; gap: 8px; }
        .toggle-switch { width: 44px; height: 24px; background: #444; border-radius: 12px; position: relative; cursor: pointer; transition: background 0.2s; }
        .toggle-switch.active { background: #667eea; }
        .toggle-switch::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: left 0.2s; }
        .toggle-switch.active::after { left: 22px; }

        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2a3e; }
        .settings-label { color: #ccc; font-size: 0.85rem; }
        .settings-value { display: flex; align-items: center; gap: 6px; }
        .settings-input { width: 56px; padding: 8px; border: 1px solid #2a2a3e; border-radius: 8px; background: #0f0f1a; color: #fff; text-align: center; font-size: 0.85rem; }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
            .fab { bottom: calc(20px + env(safe-area-inset-bottom)); }
            .modal { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        }

        .debug-toggle { position: fixed; top: 8px; left: 8px; background: rgba(255,255,255,0.1); color: #666; border: none; padding: 6px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; z-index: 500; opacity: 0.4; }
        .debug-toggle:hover { opacity: 1; }
        .debug-toggle.active { background: #dc2626; color: white; opacity: 1; }
        .debug-panel { position: fixed; top: 42px; left: 8px; max-width: 320px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 10px; padding: 14px; z-index: 500; display: none; font-size: 0.85rem; }
        .debug-panel.active { display: block; }
        .debug-row { display: flex; justify-content: space-between; padding: 6px 0; }
        .debug-label { color: #888; }
        .debug-value { color: #4ade80; font-family: monospace; }
        .debug-controls { display: flex; gap: 6px; margin-top: 10px; }
        .debug-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .debug-btn-nav { background: #2a2a3e; color: white; }
        .debug-btn-reset { background: #dc2626; color: white; }
        .debug-btn-time { background: #2563eb; color: white; }
        .debug-offset { background: #dc2626; color: white; padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; margin-left: 6px; }

        /* Emoji picker */
        .emoji-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; max-height: 160px; overflow-y: auto; padding: 4px; background: #0a0a14; border-radius: 8px; }
        .emoji-option {
            width: 36px; height: 36px; border-radius: 6px; border: 2px solid transparent;
            background: #1a1a2e; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.15s;
        }
        .emoji-option:active { transform: scale(0.95); }
        .emoji-option.selected { border-color: #667eea; background: rgba(102, 126, 234, 0.3); }
        .emoji-option.used { opacity: 0.25; cursor: not-allowed; }

        /* Details header with large icon */
        .details-icon-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
        .details-large-icon {
            width: 72px; height: 72px; border-radius: 50%; background: #0f0f1a;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            margin-bottom: 8px;
        }
        .details-habit-name { font-size: 1.1rem; font-weight: 600; color: #fff; text-align: center; }

        /* Lightweight subtask popup */
        .subtask-popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: flex; align-items: center;
            justify-content: center; z-index: 250; opacity: 0; visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
        }
        .subtask-popup-overlay.active { opacity: 1; visibility: visible; }
        .subtask-popup {
            background: #1a1a2e; border-radius: 12px; padding: 12px; width: 280px;
            max-width: 90%; transform: scale(0.95); transition: transform 0.15s;
        }
        .subtask-popup-overlay.active .subtask-popup { transform: scale(1); }
        .subtask-popup-header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 1px solid #2a2a3e;
        }
        .subtask-popup-icon { font-size: 1.2rem; }
        .subtask-popup-title { font-size: 0.9rem; font-weight: 600; color: #fff; flex: 1; }
        .subtask-popup-close { background: none; border: none; color: #666; font-size: 1.2rem; cursor: pointer; padding: 4px; }
        .subtask-popup-list { display: flex; flex-direction: column; gap: 2px; }
        .subtask-popup-item {
            display: flex; align-items: center; gap: 10px; padding: 8px;
            background: #0f0f1a; border-radius: 8px; cursor: pointer; transition: background 0.1s;
        }
        .subtask-popup-item:active { background: #252540; }
        .subtask-popup-item .subtask-checkbox { width: 20px; height: 20px; }
        .subtask-popup-item .subtask-name { font-size: 0.85rem; }

        /* Points selection popup */
        .points-popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: flex; align-items: center;
            justify-content: center; z-index: 250; opacity: 0; visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
        }
        .points-popup-overlay.active { opacity: 1; visibility: visible; }
        .points-popup {
            background: #1a1a2e; border-radius: 12px; padding: 16px; width: 260px;
            max-width: 90%; transform: scale(0.95); transition: transform 0.15s;
            text-align: center;
        }
        .points-popup-overlay.active .points-popup { transform: scale(1); }
        .points-popup-header {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 6px;
        }
        .points-popup-icon { font-size: 1.4rem; }
        .points-popup-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .points-popup-target { font-size: 0.75rem; color: #888; margin-bottom: 14px; }
        .points-popup-buttons { display: flex; gap: 10px; justify-content: center; }
        .points-btn {
            width: 60px; height: 60px; border-radius: 12px; border: 2px solid #2a2a3e;
            background: #0f0f1a; color: #fff; font-size: 1.5rem; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
        }
        .points-btn:active { transform: scale(0.95); background: #667eea; border-color: #667eea; }

        /* Emoji picker popup */
        .emoji-popup-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: flex; align-items: center;
            justify-content: center; z-index: 260; opacity: 0; visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
        }
        .emoji-popup-overlay.active { opacity: 1; visibility: visible; }
        .emoji-popup {
            background: #1a1a2e; border-radius: 12px; padding: 16px; width: 340px;
            max-width: 95%; max-height: 80vh; overflow-y: auto;
            transform: scale(0.95); transition: transform 0.15s;
        }
        .emoji-popup-overlay.active .emoji-popup { transform: scale(1); }
        .emoji-category { margin-bottom: 12px; }
        .emoji-category-header { font-size: 0.7rem; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .emoji-category-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
        .emoji-select-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 14px;
            background: #0f0f1a; border: 2px solid #2a2a3e; border-radius: 10px;
            cursor: pointer; transition: all 0.15s;
        }
        .emoji-select-btn:active { border-color: #667eea; }
        .emoji-select-icon { font-size: 1.5rem; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
        .emoji-select-text { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Habits</h1>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
        <p class="date-header" id="currentDate"></p>
        <p class="time-note" id="timeNote"></p>
        <div id="habitsContainer"></div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- Add Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event, 'modalOverlay', closeModal)">
        <div class="modal" id="createModal"></div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="detailsOverlay" onclick="handleOverlayClick(event, 'detailsOverlay', closeDetails)">
        <div class="modal" id="detailsModal"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsOverlay" onclick="handleOverlayClick(event, 'settingsOverlay', closeSettings)">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="settings-row">
                <span class="settings-label">Sort habits by</span>
                <select class="settings-select" id="sortMethod">
                    <option value="default">Default</option>
                    <option value="attention">Needs attention</option>
                    <option value="alphabetical">A-Z</option>
                </select>
            </div>
            <div class="settings-row">
                <span class="settings-label">Morning starts at</span>
                <div class="settings-value">
                    <input type="number" class="settings-input" id="morningStart" min="0" max="23" value="5">
                    <span style="color:#666">:00</span>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label">Bedtime starts at</span>
                <div class="settings-value">
                    <input type="number" class="settings-input" id="nightStart" min="0" max="23" value="18">
                    <span style="color:#666">:00</span>
                </div>
            </div>
            <div class="settings-row" style="border-bottom:none; color:#666; font-size:0.8rem;">
                Completions before morning count as previous day's night.
            </div>
            <button class="submit-btn" onclick="saveSettings()">Save Settings</button>
            <button class="submit-btn secondary" onclick="exportData()" style="margin-top:8px">Export All Data (JSON)</button>
        </div>
    </div>

    <!-- Subtask Popup -->
    <div class="subtask-popup-overlay" id="subtaskPopupOverlay" onclick="handleOverlayClick(event, 'subtaskPopupOverlay', closeSubtaskPopup)">
        <div class="subtask-popup" id="subtaskPopup"></div>
    </div>

    <!-- Points Popup -->
    <div class="points-popup-overlay" id="pointsPopupOverlay" onclick="handleOverlayClick(event, 'pointsPopupOverlay', closePointsPopup)">
        <div class="points-popup" id="pointsPopup"></div>
    </div>

    <!-- Emoji Picker Popup -->
    <div class="emoji-popup-overlay" id="emojiPopupOverlay" onclick="handleOverlayClick(event, 'emojiPopupOverlay', closeEmojiPopup)">
        <div class="emoji-popup" id="emojiPopup"></div>
    </div>

    <!-- Snooze Popup -->
    <div class="points-popup-overlay" id="snoozePopupOverlay" onclick="handleOverlayClick(event, 'snoozePopupOverlay', closeSnoozePopup)">
        <div class="points-popup" id="snoozePopup"></div>
    </div>

    <!-- Debug -->
    <button class="debug-toggle" id="debugToggle" onclick="toggleDebug()">🐛</button>
    <div class="debug-panel" id="debugPanel">
        <div class="debug-row"><span class="debug-label">Real:</span><span class="debug-value"><span id="debugRealDate"></span> <span id="debugRealPeriod" style="color:#888"></span></span></div>
        <div class="debug-row"><span class="debug-label">Sim:</span><span class="debug-value"><span id="debugSimDate"></span> <span id="debugSimPeriod" style="color:#888"></span></span></div>
        <div class="debug-controls">
            <button class="debug-btn debug-btn-nav" onclick="debugChangePeriod(-1)">←</button>
            <button class="debug-btn debug-btn-nav" onclick="debugChangePeriod(1)">→</button>
            <button class="debug-btn debug-btn-reset" onclick="debugResetTime()">Reset Time</button>
        </div>
        <div class="debug-controls">
            <button class="debug-btn debug-btn-time" onclick="debugSetTime('morning')">🌅 Morning</button>
            <button class="debug-btn debug-btn-time" onclick="debugSetTime('night')">🌙 Bedtime</button>
        </div>
        <div class="debug-controls" style="margin-top:8px;">
            <button class="debug-btn" style="background:#059669;color:white" onclick="loadTestData()">Test Data</button>
            <button class="debug-btn" style="background:#7c3aed;color:white" onclick="restoreData()">Restore</button>
        </div>
    </div>

    <script>
        // ========================================
        // CONSTANTS
        // ========================================

        const DAY_NAMES = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Frequency types
        const FREQ = {
            DAILY: 'daily',
            TWICE_DAILY: 'twiceDaily',
            EVERY_X_DAYS: 'everyXDays',
            TIMES_PER_PERIOD: 'timesPerPeriod',
            TIMES_PER_WEEK: 'timesPerWeek',
            TIMES_PER_MONTH: 'timesPerMonth',
            POINTS_PER_WEEK: 'pointsPerWeek',
            POINTS_PER_MONTH: 'pointsPerMonth',
            REMINDER: 'reminder'
        };

        // Time periods
        const PERIOD = {
            WEEK: 'week',
            MONTH: 'month',
            MORNING: 'morning',
            NIGHT: 'night'
        };

        // Default values
        const DEFAULTS = {
            TIMES_PER_PERIOD: 3,
            POINTS_PER_PERIOD: 12,
            EVERY_X_DAYS: 2,
            REMINDER_DAYS: 3,
            POINTS_TARGET: 5,
            MORNING_START: 5,
            NIGHT_START: 18
        };

        const EMOJI_CATEGORIES = {
            'Health & Fitness': ['💪', '🏃', '🚴', '🏊', '🧘', '🤸', '⚽', '🏀', '🎾', '🏋️', '🏈', '⛳', '🥊', '🏄', '🧗', '🚶'],
            'Self-care': ['🦷', '💊', '💉', '🧴', '🛁', '💅', '💇', '😴', '🛌', '☀️', '🧖', '💆', '🩺', '🩹', '👁️', '🧘‍♀️'],
            'Food & Drink': ['🥗', '🍎', '🥤', '💧', '☕', '🍵', '🥛', '🥕', '🥦', '🍳', '🥑', '🍌', '🫐', '🥜', '🍽️', '🧊'],
            'Productivity': ['📚', '✍️', '💼', '📝', '💻', '📧', '📱', '🗂️', '📊', '🎯', '📈', '🗓️', '⏱️', '📋', '✅', '🔔'],
            'Creative': ['🎨', '🎵', '🎸', '🎹', '📷', '✏️', '🖌️', '🎭', '🎬', '🎤', '🎻', '📺', '🎮', '🎲', '📖', '🖼️'],
            'Home': ['🧹', '🧺', '🍳', '🛒', '🌱', '🪴', '🐕', '🐈', '🏠', '🛠️', '🗑️', '🧽', '🪥', '🛏️', '🚿', '🔧'],
            'Social & Spiritual': ['🙏', '📿', '❤️', '👨‍👩‍👧', '📞', '💬', '🤝', '😊', '🧠', '💭', '🫂', '👋', '💝', '🕯️', '✝️', '☮️'],
            'Nature & Weather': ['🌅', '🌙', '⏰', '📅', '🌤️', '🌧️', '❄️', '🔥', '⭐', '✨', '🌳', '🌻', '🦋', '🐝', '🌈', '🍂'],
            'Finance & Goals': ['💰', '💵', '🏦', '📉', '🎖️', '🏆', '🥇', '💎', '🎁', '🛍️', '💳', '🧾', '📑', '🔐', '🚀', '🌟']
        };
        // Flat array for compatibility
        const HABIT_EMOJIS = Object.values(EMOJI_CATEGORIES).flat();

        // ========================================
        // APPLICATION STATE
        // ========================================

        // Global app state
        let selectedHabitId = null;
        let debugDayOffset = 0;
        let debugHourOverride = null;
        let emojiPopupMode = null; // 'new' or habit id for edit
        let editModeHabitId = null; // Track which habit is being edited for emoji exclusion
        let newHabitSubtasks = []; // Subtasks for new habit creation

        // Unified form state - used by both Create and Edit modes
        let formMode = 'create'; // 'create' or 'edit'
        let formHabitId = null; // Habit ID when editing

        // Form state object - single source of truth for form data
        const formState = {
            time: null,                          // null = anytime, 'morning', 'night'
            frequency: FREQ.DAILY,               // dropdown value
            isReminderMode: false,               // task type: reminder vs regular
            isPointsMode: false,                 // measurement: points vs completions
            allowOptional: true,                 // allow extra completions
            showSubtasks: false,                 // show subtasks input area
            icon: null,                          // selected emoji
            timesPeriod: PERIOD.WEEK,            // 'week' or 'month' for times
            pointsPeriod: PERIOD.WEEK,           // 'week' or 'month' for points
            hideSubtasksOnMain: false            // hide subtasks on main screen (edit only)
        };

        // Reset form state to defaults
        function resetFormState() {
            formState.time = null;
            formState.frequency = FREQ.DAILY;
            formState.isReminderMode = false;
            formState.isPointsMode = false;
            formState.allowOptional = true;
            formState.showSubtasks = false;
            formState.icon = null;
            formState.timesPeriod = PERIOD.WEEK;
            formState.pointsPeriod = PERIOD.WEEK;
            formState.hideSubtasksOnMain = false;
        }

        // Initialize form state from habit (for edit mode)
        function initFormStateFromHabit(habit) {
            formState.time = habit.timeOfDay;
            formState.icon = habit.icon || HABIT_EMOJIS[0];
            formState.allowOptional = habit.allowOptional !== false;
            formState.hideSubtasksOnMain = habit.showSubtasksOnMain === false;
            formState.showSubtasks = false; // Will show if habit has subtasks

            // Determine mode based on frequency type
            const freqType = habit.frequency.type;
            formState.isReminderMode = freqType === FREQ.REMINDER;
            formState.isPointsMode = freqType === FREQ.POINTS_PER_WEEK || freqType === FREQ.POINTS_PER_MONTH;

            // Map frequency type to dropdown value
            if (freqType === FREQ.REMINDER) {
                formState.frequency = FREQ.DAILY;
            } else if (freqType === FREQ.POINTS_PER_WEEK || freqType === FREQ.POINTS_PER_MONTH ||
                       freqType === FREQ.TIMES_PER_WEEK || freqType === FREQ.TIMES_PER_MONTH) {
                formState.frequency = FREQ.TIMES_PER_PERIOD;
            } else {
                formState.frequency = freqType;
            }

            formState.timesPeriod = (freqType === FREQ.TIMES_PER_MONTH) ? PERIOD.MONTH : PERIOD.WEEK;
            formState.pointsPeriod = (freqType === FREQ.POINTS_PER_MONTH) ? PERIOD.MONTH : PERIOD.WEEK;
        }

        // Get current form state (for compatibility with renderHabitForm)
        function getFormState(habit = null) {
            // For edit mode with existing subtasks, override showSubtasks
            if (formMode === 'edit' && habit?.subtasks?.length > 0) {
                return { ...formState, showSubtasks: true };
            }
            return formState;
        }

        // Render the habit form (shared between Create and Edit modes)
        function renderHabitForm(habit = null) {
            const isEdit = formMode === 'edit';
            const state = getFormState(habit);
            const currentIcon = state.icon || (habit?.icon) || '📌';
            const habitName = habit ? escapeHtml(habit.name) : '';
            // Points only disabled when Reminder is active (frequency auto-switches when Points enabled)
            const pointsDisabled = state.isReminderMode;
            const optionalDisabled = state.frequency !== FREQ.TIMES_PER_PERIOD || state.isReminderMode;
            const isTwiceDaily = state.frequency === FREQ.TWICE_DAILY;

            // Build frequency inputs (use lowercase IDs for create, camelCase with 'edit' prefix for edit)
            const idPrefix = isEdit ? 'edit' : '';
            let freqInputsHtml = '';
            if (state.frequency === FREQ.EVERY_X_DAYS) {
                if (state.isPointsMode) {
                    const ptsVal = habit?.frequency?.pointsTarget || DEFAULTS.POINTS_TARGET;
                    const daysVal = habit?.frequency?.everyXDays || DEFAULTS.EVERY_X_DAYS;
                    freqInputsHtml = `<input type="number" class="frequency-input" id="${idPrefix}${isEdit ? 'P' : 'p'}ointsTarget" value="${ptsVal}" min="1"><span style="color:#888">pts /</span>
                        <input type="number" class="frequency-input" id="${idPrefix}${isEdit ? 'E' : 'e'}veryXDays" value="${daysVal}" min="1"><span style="color:#888">days</span>`;
                } else {
                    const daysVal = habit?.frequency?.everyXDays || DEFAULTS.EVERY_X_DAYS;
                    freqInputsHtml = `<input type="number" class="frequency-input" id="${idPrefix}${isEdit ? 'E' : 'e'}veryXDays" value="${daysVal}" min="1"><span style="color:#888">days</span>`;
                }
            } else if (state.frequency === FREQ.TIMES_PER_PERIOD) {
                if (state.isPointsMode) {
                    const ptsVal = habit?.frequency?.pointsPerWeek || habit?.frequency?.pointsPerMonth || DEFAULTS.POINTS_PER_PERIOD;
                    freqInputsHtml = `<input type="number" class="frequency-input" id="${idPrefix}${isEdit ? 'P' : 'p'}ointsPerPeriod" value="${ptsVal}" min="1"><span style="color:#888">pts /</span>
                        <div class="period-toggle">
                            <button type="button" class="period-toggle-btn ${state.pointsPeriod === PERIOD.WEEK ? 'active' : ''}" onclick="setFormPeriod('points', '${PERIOD.WEEK}')">wk</button>
                            <button type="button" class="period-toggle-btn ${state.pointsPeriod === PERIOD.MONTH ? 'active' : ''}" onclick="setFormPeriod('points', '${PERIOD.MONTH}')">mo</button>
                        </div>`;
                } else {
                    const timesVal = habit?.frequency?.timesPerWeek || habit?.frequency?.timesPerMonth || DEFAULTS.TIMES_PER_PERIOD;
                    freqInputsHtml = `<input type="number" class="frequency-input" id="${idPrefix}${isEdit ? 'T' : 't'}imesPerPeriod" value="${timesVal}" min="1" max="31">
                        <div class="period-toggle">
                            <button type="button" class="period-toggle-btn ${state.timesPeriod === PERIOD.WEEK ? 'active' : ''}" onclick="setFormPeriod('times', '${PERIOD.WEEK}')">wk</button>
                            <button type="button" class="period-toggle-btn ${state.timesPeriod === PERIOD.MONTH ? 'active' : ''}" onclick="setFormPeriod('times', '${PERIOD.MONTH}')">mo</button>
                        </div>`;
                }
            }

            // Subtasks section (for create mode or edit mode with subtasks)
            const subtasks = isEdit ? (habit?.subtasks || []) : newHabitSubtasks;
            const showSubtasksArea = isEdit || state.showSubtasks;
            let subtasksHtml = '';
            if (showSubtasksArea || subtasks.length > 0) {
                const subtaskItems = isEdit ? subtasks.map(s => `
                    <div class="subtask-item">
                        <input type="text" class="subtask-name-input" value="${escapeHtml(s.name)}"
                            onchange="updateEditSubtask(${habit.id}, ${s.id}, this.value)"
                            onkeypress="if(event.key==='Enter')this.blur()">
                        <span class="subtask-delete" onclick="deleteSubtask(${habit.id}, ${s.id})">✕</span>
                    </div>
                `).join('') : subtasks.map(s => `
                    <div class="subtask-item">
                        <input type="text" class="subtask-name-input" value="${escapeHtml(s.name)}"
                            onchange="updateNewHabitSubtask(${s.id}, this.value)"
                            onkeypress="if(event.key==='Enter')this.blur()">
                        <span class="subtask-delete" onclick="removeNewHabitSubtask(${s.id})">✕</span>
                    </div>
                `).join('');

                subtasksHtml = `
                    <div class="form-group" id="${isEdit ? 'editSubtasksArea' : 'subtasksInputArea'}" style="${showSubtasksArea ? '' : 'display:none'}">
                        <label class="form-label">Subtasks</label>
                        <div id="${isEdit ? 'editSubtasksList' : 'newHabitSubtasksList'}">${subtaskItems}</div>
                        <div class="add-subtask">
                            <input type="text" id="${isEdit ? 'editSubtaskInput' : 'newHabitSubtaskInput'}" placeholder="Add subtask..."
                                onkeypress="if(event.key==='Enter'){event.preventDefault();${isEdit ? `addSubtask(${habit.id})` : 'addNewHabitSubtask()'};}">
                            <button type="button" onclick="${isEdit ? `addSubtask(${habit.id})` : 'addNewHabitSubtask()'}">+</button>
                        </div>
                    </div>`;
            }

            // Hide subtasks toggle (only for edit mode with existing subtasks)
            let hideSubtasksHtml = '';
            if (isEdit && subtasks.length > 0) {
                hideSubtasksHtml = `
                    <div class="form-group">
                        <div class="settings-row" style="border:none;padding:8px 0">
                            <span class="settings-label">Hide subtasks on main screen</span>
                            <div class="toggle-switch ${formState.hideSubtasksOnMain ? 'active' : ''}" id="hideSubtasksToggle" onclick="toggleFormHideSubtasks()"></div>
                        </div>
                    </div>`;
            }

            const reminderDays = habit?.frequency?.reminderDays || DEFAULTS.REMINDER_DAYS;

            return `
                <div class="modal-header">
                    <h2 class="modal-title">${isEdit ? 'Edit Habit' : 'New Habit'}</h2>
                    <button class="modal-close" onclick="${isEdit ? 'closeDetails' : 'closeModal'}()">&times;</button>
                </div>
                <div class="form-group">
                    <div style="display:flex;gap:10px;margin-bottom:6px">
                        <label class="form-label" style="margin:0;width:52px;flex-shrink:0">Icon</label>
                        <label class="form-label" style="margin:0;flex:1">Name</label>
                        <label class="form-label" style="margin:0;width:86px;flex-shrink:0">Time</label>
                    </div>
                    <div style="display:flex;gap:10px;align-items:stretch;height:48px">
                        <div class="emoji-select-btn" onclick="openEmojiPopup('${isEdit ? 'edit' : 'new'}'${isEdit ? `, ${habit.id}` : ''})" style="flex-shrink:0;width:52px;justify-content:center;box-sizing:border-box;font-size:1.3rem">
                            <span class="emoji-select-icon" id="${isEdit ? 'editSelectedEmojiDisplay' : 'selectedEmojiDisplay'}" style="width:auto;height:auto">${currentIcon}</span>
                        </div>
                        <input type="text" class="form-input" id="${isEdit ? 'editHabitName' : 'habitInput'}" value="${habitName}" placeholder="e.g., Brush teeth..." style="flex:1;margin:0;box-sizing:border-box" onkeypress="if(event.key==='Enter')${isEdit ? 'saveHabitEdit' : 'addHabit'}()" />
                        <div class="time-toggle" id="${isEdit ? 'editTimeToggle' : 'timeToggle'}" style="height:100%">
                            <button type="button" class="time-toggle-btn ${state.time === PERIOD.MORNING ? 'active' : ''} ${isTwiceDaily ? 'disabled' : ''}" data-time="morning" onclick="toggleFormTime('${PERIOD.MORNING}')">🌅</button>
                            <button type="button" class="time-toggle-btn ${state.time === PERIOD.NIGHT ? 'active' : ''} ${isTwiceDaily ? 'disabled' : ''}" data-time="night" onclick="toggleFormTime('${PERIOD.NIGHT}')">🌙</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Options</label>
                    <div class="task-options">
                        <label class="option-pill ${state.showSubtasks ? 'active' : ''}" id="${isEdit ? 'editSubtasksPill' : 'subtasksPill'}" onclick="toggleFormSubtasks()">
                            <span class="option-pill-check">✓</span>
                            <span>Subtasks</span>
                        </label>
                        <label class="option-pill ${state.isPointsMode ? 'active' : ''} ${pointsDisabled ? 'disabled' : ''}" id="${isEdit ? 'editPointsPill' : 'pointsPill'}" onclick="toggleFormPointsMode()">
                            <span class="option-pill-check">✓</span>
                            <span>Points</span>
                        </label>
                        <label class="option-pill ${state.allowOptional && !optionalDisabled ? 'active' : ''} ${optionalDisabled ? 'disabled' : ''}" id="${isEdit ? 'editOptionalPill' : 'optionalPill'}" onclick="toggleFormAllowOptional()">
                            <span class="option-pill-check">✓</span>
                            <span>Allow extra</span>
                        </label>
                        <label class="option-pill ${state.isReminderMode ? 'active' : ''}" id="${isEdit ? 'editReminderPill' : 'reminderPill'}" onclick="toggleFormReminderMode()">
                            <span class="option-pill-check">✓</span>
                            <span>Reminder</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="${isEdit ? 'editFrequencyGroup' : 'frequencyGroup'}">
                    <label class="form-label">Frequency</label>
                    <div class="frequency-row" id="${isEdit ? 'editFrequencyRow' : 'frequencyRow'}" style="${state.isReminderMode ? 'display:none' : 'display:flex'}">
                        <select class="form-input" id="${isEdit ? 'editFrequencySelect' : 'frequencySelect'}" onchange="selectFormFrequency(this.value)" style="flex:1">
                            <option value="${FREQ.DAILY}" ${state.frequency === FREQ.DAILY ? 'selected' : ''} ${state.isPointsMode ? 'disabled' : ''}>Daily${state.isPointsMode ? ' (not with Points)' : ''}</option>
                            <option value="${FREQ.TWICE_DAILY}" ${state.frequency === FREQ.TWICE_DAILY ? 'selected' : ''} ${state.isPointsMode ? 'disabled' : ''}>Twice daily${state.isPointsMode ? ' (not with Points)' : ''}</option>
                            <option value="${FREQ.EVERY_X_DAYS}" ${state.frequency === FREQ.EVERY_X_DAYS ? 'selected' : ''}>Every X days</option>
                            <option value="${FREQ.TIMES_PER_PERIOD}" ${state.frequency === FREQ.TIMES_PER_PERIOD ? 'selected' : ''}>X per week/month</option>
                        </select>
                        <div id="${isEdit ? 'editFrequencyInputs' : 'frequencyInputs'}">${freqInputsHtml}</div>
                    </div>
                    <div class="frequency-row" id="${isEdit ? 'editReminderRow' : 'reminderRow'}" style="${state.isReminderMode ? 'display:flex' : 'display:none'}">
                        <span style="color:#888">Every</span>
                        <input type="number" class="frequency-input" id="${isEdit ? 'editReminderDays' : 'reminderDays'}" value="${reminderDays}" min="1">
                        <span style="color:#888">days</span>
                    </div>
                </div>
                ${subtasksHtml}
                ${hideSubtasksHtml}
                <div class="action-buttons">
                    <button class="submit-btn" onclick="${isEdit ? 'saveHabitEdit' : 'addHabit'}()">${isEdit ? 'Save Changes' : 'Add Habit'}</button>
                    ${isEdit ? '<button class="submit-btn secondary" onclick="toggleEditMode()">Cancel</button>' : ''}
                </div>`;
        }

        // ========================================
        // UNIFIED FORM FUNCTIONS
        // ========================================

        // Re-render form based on current mode
        function rerenderForm() {
            if (formMode === 'create') {
                document.getElementById('createModal').innerHTML = renderHabitForm();
            } else {
                const habit = loadHabits().find(h => h.id === formHabitId);
                document.getElementById('detailsModal').innerHTML = renderHabitForm(habit);
            }
        }

        // Unified period setter
        function setFormPeriod(type, period) {
            if (type === 'times') {
                formState.timesPeriod = period;
            } else {
                formState.pointsPeriod = period;
            }
            rerenderForm();
        }

        // Unified toggle functions
        function toggleFormTime(t) {
            formState.time = formState.time === t ? null : t;
            rerenderForm();
        }

        function toggleFormReminderMode() {
            formState.isReminderMode = !formState.isReminderMode;
            if (formState.isReminderMode) {
                formState.isPointsMode = false;
            }
            rerenderForm();
        }

        function toggleFormPointsMode() {
            // Points is not compatible with Reminder mode
            if (formState.isReminderMode) return;
            formState.isPointsMode = !formState.isPointsMode;
            // When enabling points, auto-switch from incompatible frequencies
            if (formState.isPointsMode && (formState.frequency === FREQ.DAILY || formState.frequency === FREQ.TWICE_DAILY)) {
                formState.frequency = FREQ.TIMES_PER_PERIOD; // Default to X per week/month
            }
            rerenderForm();
        }

        function toggleFormAllowOptional() {
            const optionalDisabled = formState.frequency !== FREQ.TIMES_PER_PERIOD || formState.isReminderMode;
            if (optionalDisabled) return;
            formState.allowOptional = !formState.allowOptional;
            rerenderForm();
        }

        function toggleFormSubtasks() {
            formState.showSubtasks = !formState.showSubtasks;
            rerenderForm();
            if (formState.showSubtasks) {
                const inputId = formMode === 'edit' ? 'editSubtaskInput' : 'newHabitSubtaskInput';
                setTimeout(() => document.getElementById(inputId)?.focus(), 0);
            }
        }

        function toggleFormHideSubtasks() {
            formState.hideSubtasksOnMain = !formState.hideSubtasksOnMain;
            rerenderForm();
        }

        function selectFormFrequency(f) {
            formState.frequency = f;
            // Reset time for Twice Daily
            if (f === FREQ.TWICE_DAILY) {
                formState.time = null;
            }
            // Auto-disable points for daily/twiceDaily
            if ((f === FREQ.DAILY || f === FREQ.TWICE_DAILY) && formState.isPointsMode) {
                formState.isPointsMode = false;
            }
            rerenderForm();
        }

        function getUsedIcons(excludeId = null) {
            const habits = loadHabits();
            return new Set(habits.filter(h => h.id !== excludeId && h.icon).map(h => h.icon));
        }

            emojiPopupMode = mode;

        function renderEmojiPopup() {
            const excludeId = emojiPopupMode === 'new' ? null : editModeHabitId;
            const usedIcons = getUsedIcons(excludeId);

        function getSettings() {
            const s = localStorage.getItem('habit_settings');
            return s ? JSON.parse(s) : { morningStart: 5, nightStart: 18, sortMethod: 'default' };
        }

        function toggleDebug() {
            document.getElementById('debugToggle').classList.toggle('active');
            document.getElementById('debugPanel').classList.toggle('active');
            updateDebugDisplay();
            renderHabits(); // Re-render to expand/collapse sections based on debug mode
        }

        function debugChangePeriod(direction) {
            const s = getSettings();
            const currentPeriod = getTimeOfDayNow();

            if (direction > 0) {
                // Forward: morning → night (same day), night → morning (next day)
                if (currentPeriod === 'morning') {
                    debugHourOverride = s.nightStart + 1;
                } else {
                    debugDayOffset += 1;
                    debugHourOverride = s.morningStart + 1;
                }
            } else {
                // Backward: morning → night (prev day), night → morning (same day)
                if (currentPeriod === 'morning') {
                    debugDayOffset -= 1;
                    debugHourOverride = s.nightStart + 1;
                } else {
                    debugHourOverride = s.morningStart + 1;
                }
            }

            // Sync all habits' lastScoreUpdate to new simulated date to prevent false neglect
            const newToday = getTodayString();
            const habits = loadHabits();
            habits.forEach(h => { h.lastScoreUpdate = newToday; });
            saveHabits(habits);
            updateDebugDisplay();
            updateDisplay();
        }
        function debugSetTime(p) {
            const s = getSettings();
            if (p === 'morning') {
                debugHourOverride = s.morningStart + 1;
            } else if (p === 'night') {
                debugHourOverride = s.nightStart + 1;
            }
            updateDebugDisplay(); updateDisplay();
        }
        function debugResetTime() {
            debugDayOffset = 0;
            debugHourOverride = null;
            // Sync all habits' lastScoreUpdate to real date to prevent false neglect
            const newToday = getTodayString();
            const habits = loadHabits();
            habits.forEach(h => { h.lastScoreUpdate = newToday; });
            saveHabits(habits);
            updateDebugDisplay();
            updateDisplay();
        }
        function updateDebugDisplay() {
            const s = getSettings();
            const realHour = new Date().getHours();
            const realPeriod = (realHour >= s.morningStart && realHour < s.nightStart) ? 'morning' : 'night';
            document.getElementById('debugRealDate').textContent = new Date().toLocaleDateString();
            document.getElementById('debugRealPeriod').textContent = realPeriod;
            document.getElementById('debugSimDate').textContent = getSimulatedDate().toLocaleDateString();
            document.getElementById('debugSimPeriod').textContent = getTimeOfDayNow();
        }

        function getSimulatedDate() {
            const d = new Date();
            d.setDate(d.getDate() + debugDayOffset);
            if (debugHourOverride !== null) d.setHours(debugHourOverride, 0, 0, 0);
            return d;
        }

        function getEffectiveDate() {
            const d = getSimulatedDate();
            const s = getSettings();
            const hour = debugHourOverride !== null ? debugHourOverride : d.getHours();
            if (hour < s.morningStart) d.setDate(d.getDate() - 1);
            return toDateString(d);
        }

        // Format date as YYYY-MM-DD using LOCAL timezone (not UTC)
        function toDateString(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function getTodayString() { return getEffectiveDate(); }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function getTimeOfDayNow() {
            const s = getSettings();
            const hour = debugHourOverride !== null ? debugHourOverride : new Date().getHours();
            // Only two periods: morning (until nightStart) and night/bedtime
            if (hour >= s.morningStart && hour < s.nightStart) return 'morning';
            return 'night';
        }

        function updateDisplay() {
            const simDate = getSimulatedDate();
            const s = getSettings();
            document.getElementById('currentDate').innerHTML = formatDate(simDate) +
                (debugDayOffset !== 0 || debugHourOverride !== null ? `<span class="debug-offset">${debugDayOffset >= 0 ? '+' : ''}${debugDayOffset}d</span>` : '');
            const hour = debugHourOverride !== null ? debugHourOverride : simDate.getHours();
            if (hour < s.morningStart) {
                const prev = new Date(simDate); prev.setDate(prev.getDate() - 1);
                document.getElementById('timeNote').textContent = `Before ${s.morningStart}am — counts as ${formatDate(prev)}`;
            } else {
                document.getElementById('timeNote').textContent = '';
            }
            renderHabits();
            // Re-render open panels to update subtask states for new day
            if (selectedHabitId) renderDetails();
            if (subtaskPopupHabitId) renderSubtaskPopup();
        }

        function loadHabits() { const h = localStorage.getItem('habits_v3'); return h ? JSON.parse(h) : []; }
        function saveHabits(h) { localStorage.setItem('habits_v3', JSON.stringify(h)); }

        function handleOverlayClick(e, id, closeFn) { if (e.target === document.getElementById(id)) closeFn(); }

        function openModal() {
            // Reset state for create mode
            formMode = 'create';
            formHabitId = null;
            resetFormState();

            // Select first unused emoji
            const usedIcons = getUsedIcons();

        function openSettings() {
            const s = getSettings();
            document.getElementById('morningStart').value = s.morningStart;
            document.getElementById('nightStart').value = s.nightStart;
            document.getElementById('sortMethod').value = s.sortMethod || 'default';

        function saveSettings() {
            localStorage.setItem('habit_settings', JSON.stringify({
                morningStart: parseInt(document.getElementById('morningStart').value) || 5,
                nightStart: parseInt(document.getElementById('nightStart').value) || 18,

            }));

        function exportData() {
            const data = {
                exportedAt: new Date().toISOString(),
                version: 'habits_v3',
                settings: getSettings(),
                habits: loadHabits()
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `habits-export-${getTodayString()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Subtask functions for new habit creation
        function addNewHabitSubtask() {
            const input = document.getElementById('newHabitSubtaskInput');
            const name = input.value.trim();
            if (!name) return;
            newHabitSubtasks.push({ id: Date.now(), name, completedPeriods: {} });
            rerenderForm();
            setTimeout(() => document.getElementById('newHabitSubtaskInput')?.focus(), 0);
        }

        function removeNewHabitSubtask(id) {
            newHabitSubtasks = newHabitSubtasks.filter(s => s.id !== id);
            rerenderForm();
        }

        function updateNewHabitSubtask(id, newName) {
            const subtask = newHabitSubtasks.find(s => s.id === id);

        // Determine the final frequency type based on form state
        function getFrequencyType() {
            if (formState.isReminderMode) {
                return FREQ.REMINDER;
            }
            if (formState.isPointsMode) {
                if (formState.frequency === FREQ.TIMES_PER_PERIOD) {
                    return formState.pointsPeriod === PERIOD.WEEK ? FREQ.POINTS_PER_WEEK : FREQ.POINTS_PER_MONTH;
                }
                return formState.frequency; // everyXDays with points
            }
            // Normal completion mode
            if (formState.frequency === FREQ.TIMES_PER_PERIOD) {
                return formState.timesPeriod === PERIOD.WEEK ? FREQ.TIMES_PER_WEEK : FREQ.TIMES_PER_MONTH;
            }
            return formState.frequency;
        }

        function addHabit() {
            const name = document.getElementById('habitInput').value.trim();
            if (!name) return;
            const habits = loadHabits();
            const freqType = getFrequencyType();
            const timesVal = parseInt(document.getElementById('timesPerPeriod')?.value) || DEFAULTS.TIMES_PER_PERIOD;
            const pointsVal = parseInt(document.getElementById('pointsPerPeriod')?.value) || DEFAULTS.POINTS_PER_PERIOD;
            const pointsTargetVal = parseInt(document.getElementById('pointsTarget')?.value) || DEFAULTS.POINTS_TARGET;
            const reminderDaysVal = parseInt(document.getElementById('reminderDays')?.value) || DEFAULTS.REMINDER_DAYS;
            const everyXDaysVal = parseInt(document.getElementById('everyXDays')?.value) || DEFAULTS.EVERY_X_DAYS;
            habits.push({
                id: Date.now(), name,
                icon: formState.icon,
                timeOfDay: formState.time,
                frequency: {
                    type: freqType,
                    timesPerWeek: timesVal,
                    everyXDays: everyXDaysVal,
                    timesPerMonth: timesVal,
                    pointsPerWeek: pointsVal,
                    pointsPerMonth: pointsVal,
                    pointsTarget: pointsTargetVal,
                    reminderDays: reminderDaysVal
                },
                usePoints: formState.isPointsMode,
                allowOptional: formState.allowOptional,
                completions: [], skippedDates: [], snoozedUntil: null, subtasks: [...newHabitSubtasks], createdAt: getTodayString()
            });
            saveHabits(habits);
            closeModal();
            renderHabits();
        }

        function deleteHabit(id) {

                renderHabits();

        function skipHabit(id) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === id);
            const today = getTodayString();
            if (habit && !habit.skippedDates.includes(today)) {
                habit.skippedDates.push(today);

                closeDetails();

            }
        }

        let snoozePopupHabitId = null;

        function openSnoozePopup(id) {
            snoozePopupHabitId = id;
            document.getElementById('snoozePopup').innerHTML = `
                <div class="points-popup-header">
                    <span class="points-popup-title">Snooze for how long?</span>
                </div>
                <div class="points-popup-buttons">
                    <button class="points-btn" onclick="snoozeHabit(1)">1 day</button>
                    <button class="points-btn" onclick="snoozeHabit(2)">2 days</button>
                    <button class="points-btn" onclick="snoozeHabit(3)">3 days</button>
                </div>
                <div class="points-popup-buttons" style="margin-top:8px">

                </div>`;
            document.getElementById('snoozePopupOverlay').classList.add('active');

        function closeSnoozePopup() {

        function snoozeHabit(days) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === snoozePopupHabitId);
            if (habit) {
                const snoozeUntil = new Date(getTodayString());
