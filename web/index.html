            if (habit.completions.length > 1) {
                const sorted = [...habit.completions].map(c => c.date).sort();
                let totalDays = 0, count = 0;
                for (let i = 1; i < sorted.length; i++) {
                    if (sorted[i] !== sorted[i-1]) { totalDays += daysBetween(sorted[i-1], sorted[i]); count++; }
                }
                if (count > 0) avgInterval = (totalDays / count).toFixed(1) + 'd';
            }

            const isSnoozed = habit.snoozedUntil === 'night';
            const canSnooze = !isSnoozed && timeOfDay !== 'night' && !isCompletedToday(habit);

            if (editMode) {
                // Edit mode
                const currentTime = editTimeOfDay;
                const currentFreq = editFrequency;
                const currentIcon = editIcon || habit.icon || '📌';
                document.getElementById('detailsModal').innerHTML = `
                    <div class="modal-header"><h2 class="modal-title">Edit Habit</h2><button class="modal-close" onclick="closeDetails()">&times;</button></div>
                    <div class="form-group">
                        <label class="form-label">Icon</label>
                        <div class="emoji-picker" id="editEmojiPicker"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-input" id="editHabitName" value="${escapeHtml(habit.name)}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Time of Day <span style="font-weight:normal;text-transform:none">(optional)</span></label>
                        <div class="time-options">
                            <div class="time-option ${currentTime === 'morning' ? 'selected' : ''}" onclick="toggleEditTime('morning')">
                                <span class="time-option-icon">🌅</span>
                                <span class="time-option-label">Morning</span>
                            </div>
                            <div class="time-option ${currentTime === 'night' ? 'selected' : ''}" onclick="toggleEditTime('night')">
                                <span class="time-option-icon">🌙</span>
                                <span class="time-option-label">Night</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Frequency</label>
                        <div class="frequency-options">
                            <div class="frequency-option ${currentFreq === 'daily' ? 'selected' : ''}" onclick="selectEditFrequency('daily')">
                                <span class="frequency-dot"></span>
                                <span class="frequency-label">Daily</span>
                            </div>
                            <div class="frequency-option ${currentFreq === 'twiceDaily' ? 'selected' : ''}" onclick="selectEditFrequency('twiceDaily')">
                                <span class="frequency-dot"></span>
                                <span class="frequency-label">Twice daily</span>
                            </div>
                            <div class="frequency-option ${currentFreq === 'timesPerWeek' ? 'selected' : ''}" onclick="selectEditFrequency('timesPerWeek')">
                                <span class="frequency-dot"></span>
                                <span class="frequency-label">Per week:</span>
                                <input type="number" class="frequency-input" id="editTimesPerWeek" value="${habit.frequency.timesPerWeek || 3}" min="1" max="7" onclick="event.stopPropagation()">
                            </div>
                            <div class="frequency-option ${currentFreq === 'everyXDays' ? 'selected' : ''}" onclick="selectEditFrequency('everyXDays')">
                                <span class="frequency-dot"></span>
                                <span class="frequency-label">Every</span>
                                <input type="number" class="frequency-input" id="editEveryXDays" value="${habit.frequency.everyXDays || 2}" min="1" onclick="event.stopPropagation()">
                                <span style="color:#666;margin-left:4px">days</span>
                            </div>
                            <div class="frequency-option ${currentFreq === 'timesPerMonth' ? 'selected' : ''}" onclick="selectEditFrequency('timesPerMonth')">
                                <span class="frequency-dot"></span>
                                <span class="frequency-label">Per month:</span>
                                <input type="number" class="frequency-input" id="editTimesPerMonth" value="${habit.frequency.timesPerMonth || 4}" min="1" max="31" onclick="event.stopPropagation()">
                            </div>
                        </div>
                    </div>
                    ${(habit.subtasks && habit.subtasks.length > 0) ? `
                    <div class="form-group">
                        <div class="settings-row" style="border:none;padding:8px 0">
                            <span class="settings-label">Hide subtasks on main screen</span>
                            <div class="toggle-switch ${editHideSubtasks ? 'active' : ''}" id="hideSubtasksToggle" onclick="toggleHideSubtasks()"></div>
                        </div>
                    </div>` : ''}
                    <div class="action-buttons">
                        <button class="submit-btn" onclick="saveHabitEdit()">Save Changes</button>
                        <button class="submit-btn secondary" onclick="toggleEditMode()">Cancel</button>
                    </div>`;
            } else {
                // View mode
                const freqLabel = { daily: 'Daily', twiceDaily: 'Twice daily', timesPerWeek: `${habit.frequency.timesPerWeek}x/week`, timesPerMonth: `${habit.frequency.timesPerMonth || 4}x/month`, everyXDays: `Every ${habit.frequency.everyXDays} days` }[habit.frequency.type];
                const timeLabel = habit.timeOfDay ? { morning: 'Morning', night: 'Night' }[habit.timeOfDay] : 'Anytime';

                // Momentum score
                const scoreData = calculateMomentumScore(habit);
                const displayScore = scoreData.display;
                const rawScore = scoreData.raw;
                const lastCompletion = getLastCompletionDate(habit);
                const daysSinceCompletion = lastCompletion ? daysBetween(lastCompletion, today) : 999;
                const canFreshStart = daysSinceCompletion >= 60 || displayScore <= -3;

                // Recovery info
                let recoveryText = '';
                if (displayScore < 0) {
                    const completionsNeeded = Math.ceil(Math.abs(scoreData.raw) / 15);
                    recoveryText = `<div style="color:#888;font-size:0.8rem;margin-top:8px;text-align:center">${completionsNeeded} completion${completionsNeeded > 1 ? 's' : ''} to recover</div>`;
                }

                // Subtasks section
                const subtasks = habit.subtasks || [];
                let subtasksHtml = '';
                if (subtasks.length > 0 || true) { // Always show subtasks section
                    subtasksHtml = `
                        <div class="subtask-list">
                            <div class="form-label" style="margin-bottom:8px">Subtasks</div>
                            ${subtasks.map(s => {
                                const completed = isSubtaskCompleted(habit, s.id);
                                return `<div class="subtask-item">
                                    <div class="subtask-checkbox ${completed ? 'checked' : ''}" onclick="toggleSubtask(${habit.id}, ${s.id})"></div>
                                    <span class="subtask-name ${completed ? 'completed' : ''}">${escapeHtml(s.name)}</span>
                                    <span class="subtask-delete" onclick="deleteSubtask(${habit.id}, ${s.id})">✕</span>
                                </div>`;
                            }).join('')}
                            <div class="add-subtask">
                                <input type="text" id="newSubtaskInput" placeholder="Add subtask..." onkeypress="if(event.key==='Enter')addSubtask(${habit.id})">
                                <button onclick="addSubtask(${habit.id})">+</button>
                            </div>
                        </div>`;
                }

                const scoreClass = rawScore > 0 ? 'positive' : (rawScore < 0 ? 'negative' : 'neutral');
                const icon = habit.icon || '📌';
                document.getElementById('detailsModal').innerHTML = `
                    <div class="modal-header"><span></span><button class="modal-close" onclick="closeDetails()">&times;</button></div>
                    <div class="details-icon-header">
                        <div class="details-large-icon">${icon}</div>
                        <div class="details-habit-name">${escapeHtml(habit.name)}</div>
                    </div>
                    <div class="momentum-display">
                        <div class="momentum-score ${scoreClass}">${rawScore}<span class="momentum-max">/100</span></div>
                        <div class="momentum-label">Momentum</div>
                    </div>
                    <div class="detail-row"><span class="detail-label">Time</span><span class="detail-value">${timeLabel}</span></div>
                    <div class="detail-row"><span class="detail-label">Frequency</span><span class="detail-value">${freqLabel}</span></div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-number">${total}</div><div class="stat-label">Total</div></div>
                        <div class="stat-box"><div class="stat-number">${rate}%</div><div class="stat-label">Rate</div></div>
                        <div class="stat-box"><div class="stat-number">${avgInterval}</div><div class="stat-label">Avg Gap</div></div>
                    </div>
                    ${recoveryText}
                    ${subtasksHtml}
                    <div class="action-buttons">
                        <button class="submit-btn" onclick="toggleEditMode()">Edit Habit</button>
                        <div style="display:flex;gap:6px">
                            ${canSnooze ? `<button class="submit-btn secondary" style="flex:1" onclick="snoozeHabit(${habit.id})">Snooze</button>` : ''}
                            ${isSnoozed ? `<button class="submit-btn secondary" style="flex:1" onclick="unsnoozeHabit(${habit.id})">Unsnooze</button>` : ''}
                            <button class="submit-btn secondary" style="flex:1" onclick="skipHabit(${habit.id})">Skip Today</button>
                        </div>
                        ${canFreshStart ? `<button class="submit-btn secondary" onclick="freshStartHabit(${habit.id})">Fresh Start</button>` : ''}
                        <button class="submit-btn danger" onclick="deleteHabit(${habit.id})">Delete</button>
                    </div>`;
            }
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        let savedDataBeforeTest = null;

        function loadTestData() {
            // Save current data before loading test data
            savedDataBeforeTest = localStorage.getItem('habits_v3');

            const today = getTodayString();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().split('T')[0];

            const testHabits = [
                { id: 1, name: 'Brush teeth', icon: '🦷', timeOfDay: null, frequency: { type: 'twiceDaily' }, completions: [{ date: today, period: 'morning', timestamp: Date.now() }], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 2, name: 'Meditate', icon: '🧘', timeOfDay: 'morning', frequency: { type: 'daily' }, completions: [], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 3, name: 'Exercise', icon: '🏃', timeOfDay: 'morning', frequency: { type: 'timesPerWeek', timesPerWeek: 4, everyXDays: 2 }, completions: [{ date: yesterdayStr, period: null, timestamp: Date.now() - 86400000 }], skippedDates: [], snoozedUntil: null, subtasks: [
                    { id: 301, name: 'Warmup', completedPeriods: {} },
                    { id: 302, name: 'Cardio', completedPeriods: {} },
                    { id: 303, name: 'Strength', completedPeriods: {} }
                ], createdAt: yesterdayStr },
                { id: 4, name: 'Read', icon: '📚', timeOfDay: null, frequency: { type: 'daily' }, completions: [], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 5, name: 'Journal', icon: '✍️', timeOfDay: 'night', frequency: { type: 'daily' }, completions: [], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 6, name: 'Water plants', icon: '🌱', timeOfDay: 'morning', frequency: { type: 'everyXDays', timesPerWeek: 3, everyXDays: 3 }, completions: [{ date: yesterdayStr, period: null, timestamp: Date.now() - 86400000 }], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 7, name: 'Take vitamins', icon: '💊', timeOfDay: 'morning', frequency: { type: 'daily' }, completions: [{ date: today, period: null, timestamp: Date.now() }], skippedDates: [], snoozedUntil: null, subtasks: [], createdAt: yesterdayStr },
                { id: 8, name: 'Skincare', icon: '✨', timeOfDay: null, frequency: { type: 'twiceDaily' }, completions: [], skippedDates: [], snoozedUntil: null, subtasks: [
                    { id: 801, name: 'Cleanse', completedPeriods: {} },
                    { id: 802, name: 'Moisturize', completedPeriods: {} }
                ], createdAt: yesterdayStr }
            ];
            saveHabits(testHabits);
            renderHabits();
        }

        function restoreData() {
            if (savedDataBeforeTest !== null) {
                localStorage.setItem('habits_v3', savedDataBeforeTest);
                savedDataBeforeTest = null;
                renderHabits();
            }
        }

        document.getElementById('habitInput').addEventListener('keypress', e => { if (e.key === 'Enter') addHabit(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDetails(); closeSettings(); closeSubtaskPopup(); } });

        // Update scores on page load to persist momentum for missed days
        updateAllHabitScores();
        updateDisplay();
    </script>
</body>
</html>
