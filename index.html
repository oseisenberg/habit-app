<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Habit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .date-header {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .time-note {
            color: rgba(255,255,255,0.7);
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .habits-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .section-icon {
            font-size: 1.3rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .section-count {
            margin-left: auto;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .habit-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
        }

        .habit-item:last-child {
            border-bottom: none;
        }

        .habit-item.completed .habit-name {
            text-decoration: line-through;
            color: #999;
        }

        .habit-checkbox {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .habit-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .habit-name {
            font-size: 1rem;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .habit-meta {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .habit-progress {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .progress-good {
            background: #d4edda;
            color: #155724;
        }

        .progress-warning {
            background: #fff3cd;
            color: #856404;
        }

        .progress-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ff4757;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Calendar View */
        .calendar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            padding: 20px;
        }

        .calendar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .calendar-modal {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .calendar-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-nav button {
            background: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .calendar-month {
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .calendar-day-header {
            font-size: 0.7rem;
            color: #999;
            padding: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border-radius: 50%;
            position: relative;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.today {
            font-weight: bold;
            border: 2px solid #667eea;
        }

        .calendar-day.completed {
            background: #667eea;
            color: white;
        }

        .calendar-day.partial {
            background: #b8c5f2;
            color: white;
        }

        .calendar-stats {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.9rem;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: 600;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }

        .fab:hover {
            transform: scale(1.1);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #667eea;
        }

        .time-options {
            display: flex;
            gap: 10px;
        }

        .time-option {
            flex: 1;
            padding: 12px 8px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .time-option:hover {
            border-color: #667eea;
        }

        .time-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .time-option-icon {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 4px;
        }

        .time-option-label {
            font-size: 0.8rem;
        }

        .frequency-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .frequency-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .frequency-option:hover {
            border-color: #667eea;
        }

        .frequency-option.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .frequency-radio {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #667eea;
        }

        .frequency-label {
            flex: 1;
        }

        .frequency-input {
            width: 50px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .settings-note {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }

        /* Safe area */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: calc(100px + env(safe-area-inset-bottom));
            }
            .fab {
                bottom: calc(30px + env(safe-area-inset-bottom));
            }
            .modal {
                padding-bottom: calc(25px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Habits</h1>
        <p class="date-header" id="currentDate"></p>
        <p class="time-note" id="timeNote"></p>

        <div id="habitsContainer"></div>
    </div>

    <button class="fab" onclick="openModal()" aria-label="Add habit">+</button>

    <!-- Add Habit Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">New Habit</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">Habit Name</label>
                <input type="text" class="form-input" id="habitInput" placeholder="e.g., Brush teeth, Exercise..." />
            </div>

            <div class="form-group">
                <label class="form-label">Time of Day</label>
                <div class="time-options">
                    <div class="time-option selected" data-time="morning" onclick="selectTime('morning')">
                        <span class="time-option-icon">🌅</span>
                        <span class="time-option-label">Morning</span>
                    </div>
                    <div class="time-option" data-time="anytime" onclick="selectTime('anytime')">
                        <span class="time-option-icon">☀️</span>
                        <span class="time-option-label">Anytime</span>
                    </div>
                    <div class="time-option" data-time="night" onclick="selectTime('night')">
                        <span class="time-option-icon">🌙</span>
                        <span class="time-option-label">Night</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Frequency</label>
                <div class="frequency-options">
                    <label class="frequency-option selected" onclick="selectFrequency('daily')">
                        <input type="radio" name="frequency" class="frequency-radio" value="daily" checked>
                        <span class="frequency-label">Daily</span>
                    </label>
                    <label class="frequency-option" onclick="selectFrequency('twiceDaily')">
                        <input type="radio" name="frequency" class="frequency-radio" value="twiceDaily">
                        <span class="frequency-label">Twice daily (morning & night)</span>
                    </label>
                    <label class="frequency-option" onclick="selectFrequency('timesPerWeek')">
                        <input type="radio" name="frequency" class="frequency-radio" value="timesPerWeek">
                        <span class="frequency-label">Times per week:</span>
                        <input type="number" class="frequency-input" id="timesPerWeek" value="3" min="1" max="7" onclick="event.stopPropagation()">
                    </label>
                    <label class="frequency-option" onclick="selectFrequency('everyXDays')">
                        <input type="radio" name="frequency" class="frequency-radio" value="everyXDays">
                        <span class="frequency-label">Every</span>
                        <input type="number" class="frequency-input" id="everyXDays" value="2" min="1" onclick="event.stopPropagation()">
                        <span style="margin-left: 5px;">days</span>
                    </label>
                </div>
            </div>

            <div class="settings-note">
                💡 Completions before 3am count as the previous day, useful for night routines.
            </div>

            <button class="submit-btn" onclick="addHabit()">Add Habit</button>
        </div>
    </div>

    <!-- Calendar Modal -->
    <div class="calendar-overlay" id="calendarOverlay" onclick="handleCalendarOverlayClick(event)">
        <div class="calendar-modal" id="calendarModal"></div>
    </div>

    <script>
        // Constants
        const NIGHT_CUTOFF_HOUR = 3; // Completions before 3am count as previous day
        const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                            'July', 'August', 'September', 'October', 'November', 'December'];

        let selectedTime = 'morning';
        let selectedFrequency = 'daily';
        let calendarMonth = new Date();
        let selectedHabitId = null;

        // Get "effective" date - before 3am counts as previous day
        function getEffectiveDate(date = new Date()) {
            const d = new Date(date);
            if (d.getHours() < NIGHT_CUTOFF_HOUR) {
                d.setDate(d.getDate() - 1);
            }
            return d.toISOString().split('T')[0];
        }

        function getTodayString() {
            return getEffectiveDate();
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

        function getTimeOfDayNow() {
            const hour = new Date().getHours();
            // Before 3am = still night
            if (hour < NIGHT_CUTOFF_HOUR) return 'night';
            // 3am-12pm = morning
            if (hour < 12) return 'morning';
            // 12pm-6pm = afternoon (counts as anytime)
            if (hour < 18) return 'anytime';
            // After 6pm = night
            return 'night';
        }

        function loadHabits() {
            const habits = localStorage.getItem('habits_v2');
            return habits ? JSON.parse(habits) : [];
        }

        function saveHabits(habits) {
            localStorage.setItem('habits_v2', JSON.stringify(habits));
        }

        // Modal functions
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('habitInput').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('habitInput').value = '';
            selectTime('morning');
            selectFrequency('daily');
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }

        function selectTime(time) {
            selectedTime = time;
            document.querySelectorAll('.time-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.time === time);
            });
        }

        function selectFrequency(freq) {
            selectedFrequency = freq;
            document.querySelectorAll('.frequency-option').forEach(el => {
                const radio = el.querySelector('input[type="radio"]');
                el.classList.toggle('selected', radio.value === freq);
                radio.checked = radio.value === freq;
            });
        }

        function addHabit() {
            const name = document.getElementById('habitInput').value.trim();
            if (!name) return;

            const habits = loadHabits();
            const habit = {
                id: Date.now(),
                name: name,
                timeOfDay: selectedTime,
                frequency: {
                    type: selectedFrequency,
                    timesPerWeek: parseInt(document.getElementById('timesPerWeek').value) || 3,
                    everyXDays: parseInt(document.getElementById('everyXDays').value) || 2
                },
                completions: [], // Array of { date, period: 'morning'|'night'|null }
                createdAt: getTodayString()
            };

            habits.push(habit);
            saveHabits(habits);
            closeModal();
            renderHabits();
        }

        function deleteHabit(id) {
            if (confirm('Delete this habit?')) {
                let habits = loadHabits();
                habits = habits.filter(h => h.id !== id);
                saveHabits(habits);
                renderHabits();
            }
        }

        // Get completions for a specific date
        function getCompletionsForDate(habit, date) {
            return habit.completions.filter(c => c.date === date);
        }

        // Check if habit is completed for current period
        function isCompletedForPeriod(habit, date, period) {
            const completions = getCompletionsForDate(habit, date);
            if (habit.frequency.type === 'twiceDaily') {
                return completions.some(c => c.period === period);
            }
            return completions.length > 0;
        }

        // Get completion status for display
        function getCompletionStatus(habit) {
            const today = getTodayString();
            const currentPeriod = getTimeOfDayNow();

            if (habit.frequency.type === 'twiceDaily') {
                const morningDone = isCompletedForPeriod(habit, today, 'morning');
                const nightDone = isCompletedForPeriod(habit, today, 'night');
                return {
                    completed: morningDone && nightDone,
                    partial: morningDone || nightDone,
                    morningDone,
                    nightDone,
                    text: `${(morningDone ? 1 : 0) + (nightDone ? 1 : 0)}/2 today`
                };
            }

            if (habit.frequency.type === 'timesPerWeek') {
                const weekStart = getWeekStart(today);
                const count = countCompletionsInRange(habit, weekStart, today);
                const target = habit.frequency.timesPerWeek;
                const daysLeftInWeek = 7 - getDayOfWeek(today);
                const needed = target - count;
                return {
                    completed: count >= target,
                    partial: count > 0,
                    count,
                    target,
                    text: `${count}/${target} this week`,
                    onTrack: needed <= daysLeftInWeek
                };
            }

            if (habit.frequency.type === 'everyXDays') {
                const lastCompletion = getLastCompletionDate(habit);
                if (!lastCompletion) {
                    return { completed: false, text: 'Not started', due: true };
                }
                const daysSince = daysBetween(lastCompletion, today);
                const due = daysSince >= habit.frequency.everyXDays;
                return {
                    completed: daysSince === 0,
                    due,
                    text: due ? 'Due today' : `Next: ${habit.frequency.everyXDays - daysSince}d`
                };
            }

            // Daily
            const completed = getCompletionsForDate(habit, today).length > 0;
            return { completed, text: completed ? 'Done' : 'Due today' };
        }

        function getWeekStart(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay();
            d.setDate(d.getDate() - day);
            return d.toISOString().split('T')[0];
        }

        function getDayOfWeek(dateStr) {
            return new Date(dateStr).getDay();
        }

        function countCompletionsInRange(habit, startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const dates = new Set();
            habit.completions.forEach(c => {
                const d = new Date(c.date);
                if (d >= start && d <= end) {
                    dates.add(c.date);
                }
            });
            return dates.size;
        }

        function getLastCompletionDate(habit) {
            if (!habit.completions.length) return null;
            const sorted = [...habit.completions].sort((a, b) => b.date.localeCompare(a.date));
            return sorted[0].date;
        }

        function daysBetween(date1, date2) {
            const d1 = new Date(date1);
            const d2 = new Date(date2);
            return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }

        function completeHabit(id, period = null) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === id);
            const today = getTodayString();

            if (habit) {
                // For twice daily, use current period if not specified
                if (habit.frequency.type === 'twiceDaily' && !period) {
                    period = getTimeOfDayNow() === 'morning' ? 'morning' : 'night';
                }

                // Check if already completed for this period
                const existing = habit.completions.find(c =>
                    c.date === today && (habit.frequency.type !== 'twiceDaily' || c.period === period)
                );

                if (existing) {
                    // Undo completion
                    habit.completions = habit.completions.filter(c => c !== existing);
                } else {
                    // Add completion
                    habit.completions.push({ date: today, period, timestamp: Date.now() });
                }

                saveHabits(habits);
                renderHabits();
            }
        }

        function renderHabits() {
            const habits = loadHabits();
            const container = document.getElementById('habitsContainer');
            const currentPeriod = getTimeOfDayNow();

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="habits-section">
                        <div class="empty-state">
                            <div class="empty-state-icon">✨</div>
                            <div>No habits yet.<br>Tap + to add your first habit!</div>
                        </div>
                    </div>
                `;
                return;
            }

            // Group habits by time
            const groups = {
                morning: habits.filter(h => h.timeOfDay === 'morning' || h.frequency.type === 'twiceDaily'),
                anytime: habits.filter(h => h.timeOfDay === 'anytime' && h.frequency.type !== 'twiceDaily'),
                night: habits.filter(h => h.timeOfDay === 'night' || h.frequency.type === 'twiceDaily')
            };

            // Remove duplicates from morning/night (twice daily shows in both)
            const twiceDailyIds = new Set(habits.filter(h => h.frequency.type === 'twiceDaily').map(h => h.id));

            let html = '';

            // Morning section
            if (groups.morning.length > 0) {
                const completed = groups.morning.filter(h => {
                    const status = getCompletionStatus(h);
                    if (h.frequency.type === 'twiceDaily') return status.morningDone;
                    return status.completed;
                }).length;
                html += renderSection('morning', '🌅', 'Morning', groups.morning, 'morning', completed);
            }

            // Anytime section
            if (groups.anytime.length > 0) {
                const completed = groups.anytime.filter(h => getCompletionStatus(h).completed).length;
                html += renderSection('anytime', '☀️', 'Anytime', groups.anytime, null, completed);
            }

            // Night section
            if (groups.night.length > 0) {
                const completed = groups.night.filter(h => {
                    const status = getCompletionStatus(h);
                    if (h.frequency.type === 'twiceDaily') return status.nightDone;
                    return status.completed;
                }).length;
                html += renderSection('night', '🌙', 'Night', groups.night, 'night', completed);
            }

            container.innerHTML = html;
        }

        function renderSection(sectionType, icon, title, habits, period, completedCount) {
            const total = habits.length;
            let items = habits.map(h => renderHabitItem(h, period)).join('');

            return `
                <div class="habits-section">
                    <div class="section-header">
                        <span class="section-icon">${icon}</span>
                        <span class="section-title">${title}</span>
                        <span class="section-count">${completedCount}/${total}</span>
                    </div>
                    ${items}
                </div>
            `;
        }

        function renderHabitItem(habit, period) {
            const status = getCompletionStatus(habit);
            let isChecked = false;
            let progressClass = '';
            let progressText = status.text;

            if (habit.frequency.type === 'twiceDaily') {
                isChecked = period === 'morning' ? status.morningDone : status.nightDone;
                progressClass = status.completed ? 'progress-good' : (status.partial ? 'progress-warning' : '');
            } else if (habit.frequency.type === 'timesPerWeek') {
                isChecked = status.completed;
                progressClass = status.completed ? 'progress-good' : (status.onTrack ? 'progress-warning' : 'progress-danger');
            } else if (habit.frequency.type === 'everyXDays') {
                isChecked = status.completed;
                progressClass = status.completed ? 'progress-good' : (status.due ? 'progress-danger' : 'progress-warning');
            } else {
                isChecked = status.completed;
                progressClass = status.completed ? 'progress-good' : 'progress-warning';
            }

            const freqLabel = getFrequencyLabel(habit);

            return `
                <div class="habit-item ${isChecked ? 'completed' : ''}">
                    <input
                        type="checkbox"
                        class="habit-checkbox"
                        ${isChecked ? 'checked' : ''}
                        onchange="completeHabit(${habit.id}, '${period || ''}')"
                    />
                    <div class="habit-info" onclick="openCalendar(${habit.id})">
                        <span class="habit-name">${escapeHtml(habit.name)}</span>
                        <div class="habit-meta">
                            <span>${freqLabel}</span>
                            <span class="habit-progress ${progressClass}">${progressText}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${habit.id})">×</button>
                </div>
            `;
        }

        function getFrequencyLabel(habit) {
            switch (habit.frequency.type) {
                case 'daily': return 'Daily';
                case 'twiceDaily': return '2×/day';
                case 'timesPerWeek': return `${habit.frequency.timesPerWeek}×/week`;
                case 'everyXDays': return `Every ${habit.frequency.everyXDays}d`;
                default: return '';
            }
        }

        // Calendar functions
        function openCalendar(habitId) {
            selectedHabitId = habitId;
            calendarMonth = new Date();
            renderCalendar();
            document.getElementById('calendarOverlay').classList.add('active');
        }

        function closeCalendar() {
            document.getElementById('calendarOverlay').classList.remove('active');
            selectedHabitId = null;
        }

        function handleCalendarOverlayClick(event) {
            if (event.target === document.getElementById('calendarOverlay')) {
                closeCalendar();
            }
        }

        function changeMonth(delta) {
            calendarMonth.setMonth(calendarMonth.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === selectedHabitId);
            if (!habit) return;

            const year = calendarMonth.getFullYear();
            const month = calendarMonth.getMonth();
            const today = getTodayString();

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            // Build calendar grid
            let calendarDays = '';

            // Day headers
            DAY_NAMES.forEach(day => {
                calendarDays += `<div class="calendar-day-header">${day}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < startDay; i++) {
                calendarDays += '<div class="calendar-day other-month"></div>';
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const completions = getCompletionsForDate(habit, dateStr);

                let dayClass = 'calendar-day';
                if (dateStr === today) dayClass += ' today';

                if (habit.frequency.type === 'twiceDaily') {
                    const hasMorning = completions.some(c => c.period === 'morning');
                    const hasNight = completions.some(c => c.period === 'night');
                    if (hasMorning && hasNight) dayClass += ' completed';
                    else if (hasMorning || hasNight) dayClass += ' partial';
                } else if (completions.length > 0) {
                    dayClass += ' completed';
                }

                calendarDays += `<div class="${dayClass}">${day}</div>`;
            }

            // Stats
            const totalCompletions = habit.completions.length;
            const uniqueDays = new Set(habit.completions.map(c => c.date)).size;
            const daysSinceCreated = Math.max(1, daysBetween(habit.createdAt, today) + 1);
            const completionRate = Math.round((uniqueDays / daysSinceCreated) * 100);

            const modal = document.getElementById('calendarModal');
            modal.innerHTML = `
                <div class="calendar-header">
                    <h3 class="calendar-title">${escapeHtml(habit.name)}</h3>
                    <button class="calendar-close" onclick="closeCalendar()">&times;</button>
                </div>
                <div class="calendar-nav">
                    <button onclick="changeMonth(-1)">←</button>
                    <span class="calendar-month">${MONTH_NAMES[month]} ${year}</span>
                    <button onclick="changeMonth(1)">→</button>
                </div>
                <div class="calendar-grid">
                    ${calendarDays}
                </div>
                <div class="calendar-stats">
                    <div class="stat-row">
                        <span class="stat-label">Total completions</span>
                        <span class="stat-value">${totalCompletions}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Days completed</span>
                        <span class="stat-value">${uniqueDays}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Completion rate</span>
                        <span class="stat-value">${completionRate}%</span>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('habitInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addHabit();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeCalendar();
            }
        });

        // Initialize
        const now = new Date();
        document.getElementById('currentDate').textContent = formatDate(now);

        const hour = now.getHours();
        if (hour < NIGHT_CUTOFF_HOUR) {
            document.getElementById('timeNote').textContent = `Before 3am — counting as ${formatDate(new Date(now.getTime() - 86400000))}`;
        }

        renderHabits();
    </script>
</body>
</html>
