<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Habit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .date-header {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .habits-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 200px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            gap: 12px;
            flex-wrap: wrap;
        }

        .habit-item:last-child {
            border-bottom: none;
        }

        .habit-item.completed .habit-name {
            text-decoration: line-through;
            color: #999;
        }

        .habit-item.overdue {
            background: #fff5f5;
            border-radius: 8px;
            margin: 5px 0;
        }

        .habit-checkbox {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .habit-info {
            flex: 1;
            min-width: 120px;
        }

        .habit-name {
            font-size: 1.1rem;
            display: block;
        }

        .habit-schedule {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        .habit-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .habit-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .status-due {
            background: #ffeaa7;
            color: #856404;
        }

        .status-overdue {
            background: #ff7675;
            color: white;
        }

        .status-done {
            background: #00b894;
            color: white;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #ff3344;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #eee;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal */
        .modal {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #667eea;
        }

        .recurrence-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recurrence-row input[type="number"] {
            width: 80px;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .recurrence-row input[type="number"]:focus {
            border-color: #667eea;
        }

        .recurrence-row span {
            color: #666;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Safe area for iPhone notch */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: calc(100px + env(safe-area-inset-bottom));
            }
            .fab {
                bottom: calc(30px + env(safe-area-inset-bottom));
            }
            .modal {
                padding-bottom: calc(30px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Habit Tracker</h1>
        <p class="date-header" id="currentDate"></p>

        <div class="habits-list" id="habitsList">
            <div class="empty-state">
                <div class="empty-state-icon">✨</div>
                <div>No habits yet.<br>Tap + to add your first habit!</div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openModal()" aria-label="Add habit">+</button>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">New Habit</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">Habit Name</label>
                <input type="text" class="form-input" id="habitInput" placeholder="e.g., Exercise, Read, Meditate..." />
            </div>

            <div class="form-group">
                <label class="form-label">Repeat Schedule</label>
                <div class="recurrence-row">
                    <span>Every</span>
                    <input type="number" id="repeatDays" min="1" value="1" />
                    <span>day(s)</span>
                </div>
            </div>

            <button class="submit-btn" onclick="addHabit()">Add Habit</button>
        </div>
    </div>

    <script>
        // Modal functions
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('habitInput').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('habitInput').value = '';
            document.getElementById('repeatDays').value = '1';
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }

        // Get today's date as string for tracking
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        // Format date for display
        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

        // Calculate days between two date strings
        function daysBetween(date1, date2) {
            const d1 = new Date(date1);
            const d2 = new Date(date2);
            const diffTime = d2 - d1;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        // Load habits from localStorage
        function loadHabits() {
            const habits = localStorage.getItem('habits');
            return habits ? JSON.parse(habits) : [];
        }

        // Save habits to localStorage
        function saveHabits(habits) {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        // Add a new habit
        function addHabit() {
            const input = document.getElementById('habitInput');
            const repeatInput = document.getElementById('repeatDays');
            const name = input.value.trim();
            const repeatDays = parseInt(repeatInput.value) || 1;

            if (!name) return;

            const habits = loadHabits();
            habits.push({
                id: Date.now(),
                name: name,
                repeatDays: repeatDays,
                lastCompletedDate: null,
                completionCount: 0,
                createdAt: getTodayString()
            });

            saveHabits(habits);
            closeModal();
            renderHabits();
        }

        // Get habit status: 'due', 'overdue', 'done', or 'upcoming'
        function getHabitStatus(habit) {
            const today = getTodayString();

            // Never completed - it's due
            if (!habit.lastCompletedDate) {
                return { status: 'due', daysOverdue: 0 };
            }

            const daysSinceCompletion = daysBetween(habit.lastCompletedDate, today);
            const daysUntilDue = habit.repeatDays - daysSinceCompletion;

            if (daysUntilDue > 0) {
                // Completed recently, not due yet
                return { status: 'done', daysUntilDue: daysUntilDue };
            } else if (daysUntilDue === 0) {
                // Due today
                return { status: 'due', daysOverdue: 0 };
            } else {
                // Overdue
                return { status: 'overdue', daysOverdue: Math.abs(daysUntilDue) };
            }
        }

        // Complete a habit
        function completeHabit(id) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === id);
            const today = getTodayString();

            if (habit) {
                habit.lastCompletedDate = today;
                habit.completionCount = (habit.completionCount || 0) + 1;
                saveHabits(habits);
                renderHabits();
            }
        }

        // Undo completion (for habits completed today)
        function undoCompletion(id) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === id);

            if (habit && habit.lastCompletedDate === getTodayString()) {
                habit.lastCompletedDate = null;
                habit.completionCount = Math.max(0, (habit.completionCount || 1) - 1);
                saveHabits(habits);
                renderHabits();
            }
        }

        // Delete a habit
        function deleteHabit(id) {
            if (confirm('Delete this habit?')) {
                let habits = loadHabits();
                habits = habits.filter(h => h.id !== id);
                saveHabits(habits);
                renderHabits();
            }
        }

        // Render habits list
        function renderHabits() {
            const habits = loadHabits();
            const list = document.getElementById('habitsList');
            const today = getTodayString();

            if (habits.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <div>No habits yet.<br>Tap + to add your first habit!</div>
                    </div>
                `;
                return;
            }

            // Categorize habits
            const overdueHabits = [];
            const dueHabits = [];
            const completedHabits = [];

            habits.forEach(habit => {
                const statusInfo = getHabitStatus(habit);
                habit._statusInfo = statusInfo;

                if (statusInfo.status === 'overdue') {
                    overdueHabits.push(habit);
                } else if (statusInfo.status === 'due') {
                    dueHabits.push(habit);
                } else {
                    completedHabits.push(habit);
                }
            });

            // Sort overdue by most overdue first
            overdueHabits.sort((a, b) => b._statusInfo.daysOverdue - a._statusInfo.daysOverdue);
            // Sort completed by soonest due next
            completedHabits.sort((a, b) => a._statusInfo.daysUntilDue - b._statusInfo.daysUntilDue);

            let html = '';

            // Render overdue habits
            if (overdueHabits.length > 0) {
                html += '<div class="section-title">Overdue</div>';
                html += overdueHabits.map(habit => renderHabitItem(habit, today)).join('');
            }

            // Render due habits
            if (dueHabits.length > 0) {
                html += '<div class="section-title">Due Today</div>';
                html += dueHabits.map(habit => renderHabitItem(habit, today)).join('');
            }

            // Render completed habits
            if (completedHabits.length > 0) {
                html += '<div class="section-title">Completed</div>';
                html += completedHabits.map(habit => renderHabitItem(habit, today)).join('');
            }

            list.innerHTML = html;
        }

        function renderHabitItem(habit, today) {
            const statusInfo = habit._statusInfo;
            const isCompleted = statusInfo.status === 'done';
            const isOverdue = statusInfo.status === 'overdue';
            const completedToday = habit.lastCompletedDate === today;

            let statusBadge = '';
            if (isOverdue) {
                statusBadge = `<span class="habit-status status-overdue">${statusInfo.daysOverdue}d overdue</span>`;
            } else if (statusInfo.status === 'due') {
                statusBadge = '<span class="habit-status status-due">Due today</span>';
            } else if (isCompleted) {
                statusBadge = `<span class="habit-status status-done">Next: ${statusInfo.daysUntilDue}d</span>`;
            }

            const scheduleText = habit.repeatDays === 1
                ? 'Daily'
                : `Every ${habit.repeatDays} days`;

            const completionText = habit.completionCount > 0
                ? ` · ${habit.completionCount}×`
                : '';

            return `
                <div class="habit-item ${isCompleted ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}">
                    <input
                        type="checkbox"
                        class="habit-checkbox"
                        ${isCompleted ? 'checked' : ''}
                        onchange="${isCompleted && completedToday ? `undoCompletion(${habit.id})` : `completeHabit(${habit.id})`}"
                        ${isCompleted && !completedToday ? 'disabled' : ''}
                    />
                    <div class="habit-info">
                        <span class="habit-name">${escapeHtml(habit.name)}</span>
                        <span class="habit-schedule">${scheduleText}${completionText}</span>
                    </div>
                    <div class="habit-badges">
                        ${statusBadge}
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${habit.id})">Delete</button>
                </div>
            `;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter key in modal
        document.getElementById('habitInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addHabit();
            }
        });

        // Handle Escape key to close modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        document.getElementById('currentDate').textContent = formatDate(new Date());
        renderHabits();
    </script>
</body>
</html>
